[project]
name = "freestocklineskill"
version = "0.1.1"
description = "OpenClaw/Hermes free no-key A-share ecosystem data query skill."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "pandas>=2.0.0",
    "akshare>=1.12.0",
    "efinance>=0.5.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["freestocklineskill/scripts/runtime"]
